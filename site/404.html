<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | jev-curate</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <style>
    .not-found {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .not-found h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 0.75rem;
    }
    .not-found p {
      max-width: 34rem;
      margin-bottom: 1.5rem;
      color: var(--grey-1);
    }
    .not-found a.home-link {
      display: inline-block;
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius);
      font-weight: 600;
      text-decoration: none;
      border: 1px solid currentColor;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main class="not-found" id="main">
    <h1>404 &mdash; Page Not Found</h1>
    <p>The page you requested could not be found on jev-curate.</p>
    <a class="btn btn-primary home-link" href="/">Back to jev-curate</a>
  </main>
</body>
</html>
